name: Feature to Dev CI/CD

on:
  push:
    branches:
      - feature

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  JAVA_VERSION: '21'
  SOURCE_BRANCH: feature
  TARGET_BRANCH: dev

jobs:

  # ============================================================
  # 1. BUILD + TEST
  # ============================================================
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Verify Service
        run: |
          if [ ! -d "${{ matrix.service }}" ]; then
            echo "ERROR: Service directory not found"
            exit 1
          fi

          if [ ! -f "${{ matrix.service }}/pom.xml" ]; then
            echo "ERROR: pom.xml not found"
            exit 1
          fi

      - name: Maven Build and Test
        working-directory: ${{ matrix.service }}
        run: |
          set +e

          for attempt in 1 2 3
          do
            echo "=========================================="
            echo "Maven attempt $attempt / 3"
            echo "=========================================="

            if [ -f "./mvnw" ]; then
              chmod +x ./mvnw
              ./mvnw clean test package -U
              RESULT=$?
            else
              mvn clean test package -U
              RESULT=$?
            fi

            if [ $RESULT -eq 0 ]; then
              echo "Maven build successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Maven failed."
              echo "Retrying after 20 seconds..."
              sleep 20
            fi
          done

          echo "Maven build failed after 3 attempts"
          exit 1


  # ============================================================
  # 2. DOCKER BUILD VALIDATION
  # ============================================================
  docker-build:
    name: Docker Build - ${{ matrix.service }}
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Check Docker
        run: |
          docker --version

      - name: Check Dockerfile
        run: |
          if [ ! -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "ERROR: Dockerfile missing"
            echo "${{ matrix.service }}/Dockerfile"
            exit 1
          fi

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ matrix.service }}:feature-${{ github.sha }}" \
            "./${{ matrix.service }}"

      - name: Verify Docker Image
        run: |
          docker image inspect \
            "${{ matrix.service }}:feature-${{ github.sha }}"


  # ============================================================
  # 3. DOCKER COMPOSE VALIDATION
  # ============================================================
  docker-compose:
    name: Docker Compose Validation
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Docker Compose Version
        run: |
          docker compose version

      - name: Detect Compose File
        run: |
          if [ -f "docker-compose.yml" ]; then
            echo "COMPOSE_FILE=docker-compose.yml" >> "$GITHUB_ENV"

          elif [ -f "docker-compose.yaml" ]; then
            echo "COMPOSE_FILE=docker-compose.yaml" >> "$GITHUB_ENV"

          else
            echo "ERROR: docker-compose.yml not found"
            exit 1
          fi

      - name: Validate Compose
        run: |
          docker compose \
            -f "$COMPOSE_FILE" \
            config

      - name: Build Compose
        run: |
          docker compose \
            -f "$COMPOSE_FILE" \
            build


  # ============================================================
  # 4. CHECK FEATURE → DEV DIFFERENCE
  # ============================================================
  check-changes:
    name: Check Feature Changes
    needs:
      - build-and-test
      - docker-build
      - docker-compose
    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Dev
        run: |
          git fetch origin feature
          git fetch origin dev

      - name: Check Commits
        id: check
        run: |

          COMMITS=$(git rev-list --count origin/dev..origin/feature)

          echo "=========================================="
          echo "FEATURE → DEV CHECK"
          echo "=========================================="

          echo "Feature:"
          git rev-parse origin/feature

          echo "Dev:"
          git rev-parse origin/dev

          echo "Commits ahead of dev:"
          echo "$COMMITS"

          if [ "$COMMITS" -gt 0 ]; then
            echo "Changes found."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes between feature and dev."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # 5. CREATE PR
  # ============================================================
  create-pr:
    name: Create Feature → Dev PR
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:

      - name: Create or Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "=========================================="
          echo "FEATURE → DEV PULL REQUEST"
          echo "=========================================="

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Source: feature"
          echo "Target: dev"

          echo ""
          echo "Checking existing PR..."

          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base dev \
            --head feature \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Existing PR found:"
            echo "#$EXISTING_PR"

            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"

          else

            echo "Creating new PR..."

            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base dev \
              --head feature \
              --title "Feature → Dev: Automated CI/CD" \
              --body "## Automated Feature → Dev Pull Request

          This Pull Request was automatically created by GitHub Actions.

          ### Source
          feature

          ### Target
          dev

          ### CI Validation
          - Java 21
          - Maven build
          - Unit tests
          - Docker build
          - Docker Compose validation

          ### Pipeline
          feature
          ↓
          Build & Test
          ↓
          Docker Validation
          ↓
          Pull Request
          ↓
          Automatic Approval
          ↓
          Automatic Merge
          ↓
          dev")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

            echo ""
            echo "=========================================="
            echo "PR CREATED"
            echo "PR: #$PR_NUMBER"
            echo "=========================================="

            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # 6. AUTOMATIC APPROVAL
  # ============================================================
  approve-pr:
    name: Automatic PR Approval
    needs: create-pr

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Approve Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |

          echo "=========================================="
          echo "AUTOMATIC PR APPROVAL"
          echo "=========================================="

          echo "PR: #$PR_NUMBER"

          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve \
            --body "Automatically approved by CI/CD pipeline."

          echo "PR approved successfully."


  # ============================================================
  # 7. AUTOMATIC MERGE
  # ============================================================
  merge-pr:
    name: Automatic Merge → Dev
    needs:
      - create-pr
      - approve-pr

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |

          echo "=========================================="
          echo "AUTOMATIC MERGE"
          echo "=========================================="

          echo "PR: #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch=false

          echo ""
          echo "=========================================="
          echo "AUTO MERGE ENABLED"
          echo "=========================================="

          echo "GitHub will merge the PR when all required checks are satisfied."


  # ============================================================
  # 8. SUCCESS
  # ============================================================
  success:
    name: Feature → Dev Complete
    needs:
      - build-and-test
      - docker-build
      - docker-compose
      - check-changes
      - create-pr
      - approve-pr
      - merge-pr

    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.docker-compose.result == 'success' &&
      needs.check-changes.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Summary
        run: |

          echo "=========================================="
          echo "       FEATURE → DEV CI/CD SUCCESS"
          echo "=========================================="

          echo "Java 21          : PASS"
          echo "Maven            : PASS"
          echo "Unit Tests       : PASS"
          echo "Docker           : PASS"
          echo "Docker Compose   : PASS"
          echo "Change Detection : PASS"
          echo "PR Creation      : PASS"
          echo "Approval         : PASS"
          echo "Auto Merge       : ENABLED"

          echo "=========================================="
