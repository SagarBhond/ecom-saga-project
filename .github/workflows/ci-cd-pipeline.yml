name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  DOCKERHUB_USERNAME: sagarbhond

jobs:
  build-and-test:
    name: Build and Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate service directory
        shell: bash
        run: |
          if [ ! -d "${{ matrix.service }}" ]; then
            echo "ERROR: Service directory not found: ${{ matrix.service }}"
            exit 1
          fi

      - name: Build and Test Service
        shell: bash
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean test package
          elif [ -f "pom.xml" ]; then
            mvn -B clean test package
          else
            echo "ERROR: pom.xml or mvnw not found in ${{ matrix.service }}"
            exit 1
          fi

  build-and-push-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package JAR for ${{ matrix.service }}
        shell: bash
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-swagger' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-build:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose build
        shell: bash
        run: |
          docker compose config > /dev/null
          docker compose build

  deploy:
    name: Deploy to EC2 over SSH
    runs-on: ubuntu-latest
    needs:
      - build-and-push-docker
      - docker-compose-build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    environment: production
    steps:
      - name: Configure AWS credentials with static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve app EC2 instance
        id: resolve-ec2
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running EC2 instance found with Name=ecom-saga-app"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved app instance: $INSTANCE_ID"

      - name: Deploy through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.resolve-ec2.outputs.instance_id }}
        run: |
          set -euo pipefail

          for i in {1..30}; do
            PING="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)"
            if [ "$PING" = "Online" ]; then
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: SSM agent did not become Online for $INSTANCE_ID"
              exit 1
            fi
            sleep 5
          done

          jq -n --arg instance_id "$INSTANCE_ID" '{
            DocumentName: "AWS-RunShellScript",
            InstanceIds: [$instance_id],
            Parameters: {
              commands: [
                "set -e",
                "PROJECT_DIR=\"/home/ec2-user/ecom-saga-project\"",
                "REPO_URL=\"https://github.com/SagarBhond/ecom-saga-project.git\"",
                "if [ ! -d \"$PROJECT_DIR/.git\" ]; then git clone \"$REPO_URL\" \"$PROJECT_DIR\"; fi",
                "cd \"$PROJECT_DIR\"",
                "git fetch origin",
                "git checkout main",
                "git reset --hard origin/main",
                "if [ ! -f .env ] || grep -qE '^(<<<<<<<|=======|>>>>>>>)' .env; then cp .env.example .env; fi",
                "chmod +x scripts/*.sh infre_terraform/*.sh",
                "if docker compose version >/dev/null 2>&1; then COMPOSE=\"docker compose\"; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE=\"docker-compose\"; else if ! command -v curl >/dev/null 2>&1; then sudo dnf install -y curl; fi; sudo mkdir -p /usr/local/lib/docker/cli-plugins; sudo curl -fsSL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose; sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose; COMPOSE=\"docker compose\"; fi",
                "$COMPOSE version",
                "$COMPOSE -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml pull",
                "$COMPOSE -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml up -d --force-recreate",
                "echo \"Deployment complete.\""
              ]
            }
          }' > /tmp/ssm-command.json

          COMMAND_ID="$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-command.json \
            --query "Command.CommandId" \
            --output text)"

          for i in {1..60}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "ERROR: SSM deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "ERROR: SSM deployment timed out waiting for command $COMMAND_ID"
          exit 1
