name: Feature to Dev CI/CD

on:
  push:
    branches:
      - feature

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  JAVA_VERSION: '21'
  SOURCE_BRANCH: feature
  TARGET_BRANCH: dev

jobs:

  # ============================================================
  # 1. BUILD AND TEST ALL MICROSERVICES
  # ============================================================
  build-and-test:

    name: Build & Test - ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Check Service
        run: |
          if [ ! -d "${{ matrix.service }}" ]; then
            echo "Service directory not found"
            exit 1
          fi

          if [ ! -f "${{ matrix.service }}/pom.xml" ]; then
            echo "pom.xml not found"
            exit 1
          fi

      - name: Build and Test
        working-directory: ${{ matrix.service }}
        run: |

          for attempt in 1 2 3
          do

            echo "=========================================="
            echo "Maven attempt $attempt"
            echo "=========================================="

            if [ -f "./mvnw" ]; then
              chmod +x ./mvnw
              ./mvnw clean test package -U
            else
              mvn clean test package -U
            fi

            if [ $? -eq 0 ]; then
              echo "Maven build successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Maven failed."
              echo "Retrying after 20 seconds..."
              sleep 20
            fi

          done

          echo "Maven build failed after 3 attempts"
          exit 1


  # ============================================================
  # 2. DOCKER BUILD VALIDATION
  # ============================================================
  docker-build:

    name: Docker Build - ${{ matrix.service }}

    needs: build-and-test

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Docker Version
        run: docker --version

      - name: Check Dockerfile
        run: |

          if [ ! -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "Dockerfile missing:"
            echo "${{ matrix.service }}/Dockerfile"
            exit 1
          fi

      - name: Build Docker Image
        run: |

          docker build \
            -t "${{ matrix.service }}:feature-${{ github.sha }}" \
            "./${{ matrix.service }}"

      - name: Verify Image
        run: |

          docker image inspect \
            "${{ matrix.service }}:feature-${{ github.sha }}"


  # ============================================================
  # 3. DOCKER COMPOSE VALIDATION
  # ============================================================
  docker-compose:

    name: Docker Compose Validation

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Docker Compose Version
        run: docker compose version

      - name: Find Compose File
        run: |

          if [ -f "docker-compose.yml" ]; then
            echo "COMPOSE_FILE=docker-compose.yml" >> "$GITHUB_ENV"

          elif [ -f "docker-compose.yaml" ]; then
            echo "COMPOSE_FILE=docker-compose.yaml" >> "$GITHUB_ENV"

          else
            echo "Docker Compose file not found"
            exit 1
          fi

      - name: Validate Compose
        run: |

          docker compose \
            -f "$COMPOSE_FILE" \
            config

      - name: Build Compose
        run: |

          docker compose \
            -f "$COMPOSE_FILE" \
            build


  # ============================================================
  # 4. CREATE COMMON-HISTORY INTEGRATION BRANCH
  # ============================================================
  prepare-integration:

    name: Prepare Feature → Dev Integration

    needs:
      - build-and-test
      - docker-build
      - docker-compose

    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      integration_branch: ${{ steps.integration.outputs.branch }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Branches
        run: |

          git fetch origin feature
          git fetch origin dev

          echo "Feature commit:"
          git rev-parse origin/feature

          echo "Dev commit:"
          git rev-parse origin/dev

      - name: Create Integration Branch
        id: integration
        run: |

          INTEGRATION_BRANCH="ci/feature-to-dev"

          echo "Creating integration branch:"
          echo "$INTEGRATION_BRANCH"

          git checkout -B "$INTEGRATION_BRANCH" origin/dev

          echo "Integration branch is based on DEV"

          echo "=========================================="
          echo "Copying FEATURE source tree"
          echo "=========================================="

          # Replace the working tree/index with the complete
          # source tree from feature while retaining DEV history.
          git read-tree -u origin/feature

          echo "Checking status..."

          git status

          echo "=========================================="
          echo "Creating integration commit"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No differences between feature and dev."

          else

            git commit \
              -m "CI: integrate feature into dev"

          fi

          echo "=========================================="
          echo "Pushing integration branch"
          echo "=========================================="

          git push \
            origin \
            "$INTEGRATION_BRANCH" \
            --force

          echo "branch=$INTEGRATION_BRANCH" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 5. CREATE PR
  # ============================================================
  create-pr:

    name: Create PR → Dev

    needs: prepare-integration

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:

      - name: Create or Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: dev
          INTEGRATION_BRANCH: ${{ needs.prepare-integration.outputs.integration_branch }}
        run: |

          echo "=========================================="
          echo "CREATE FEATURE -> DEV PR"
          echo "=========================================="

          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo "Integration branch:"
          echo "$INTEGRATION_BRANCH"

          echo "Target:"
          echo "$TARGET_BRANCH"

          echo ""
          echo "Checking existing PR..."

          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$INTEGRATION_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Existing PR found:"
            echo "#$EXISTING_PR"

            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"

          else

            echo "Creating new PR..."

            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$TARGET_BRANCH" \
              --head "$INTEGRATION_BRANCH" \
              --title "CI: Feature → Dev" \
              --body "## Automated Feature → Dev

          This Pull Request was automatically created by GitHub Actions.

          ### Source

          feature

          ### Integration Branch

          $INTEGRATION_BRANCH

          ### Target

          dev

          ### CI Validation

          - Java 21
          - Maven build
          - Unit tests
          - Docker build
          - Docker Compose validation

          ### Git History

          The original feature and dev branches had unrelated histories.

          GitHub Actions automatically created this integration branch from dev and applied the complete feature source tree.

          ### Pipeline

          feature
          ↓
          CI
          ↓
          Integration branch
          ↓
          Pull Request
          ↓
          Automatic approval
          ↓
          Automatic merge
          ↓
          dev")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

            echo "PR created:"
            echo "#$PR_NUMBER"

            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # 6. AUTOMATIC APPROVAL
  # ============================================================
  approve-pr:

    name: Automatic PR Approval

    needs: create-pr

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Approve Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |

          echo "=========================================="
          echo "APPROVING PR"
          echo "=========================================="

          echo "PR #$PR_NUMBER"

          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve \
            --body "Automatically approved by CI/CD."


  # ============================================================
  # 7. AUTOMATIC MERGE
  # ============================================================
  merge-pr:

    name: Automatic Merge → Dev

    needs:
      - create-pr
      - approve-pr

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |

          echo "=========================================="
          echo "MERGING PR"
          echo "=========================================="

          echo "PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch=false

          echo "=========================================="
          echo "FEATURE -> DEV COMPLETE"
          echo "=========================================="


  # ============================================================
  # 8. PIPELINE SUCCESS
  # ============================================================
  success:

    name: Feature → Dev Complete

    needs:
      - build-and-test
      - docker-build
      - docker-compose
      - prepare-integration
      - create-pr
      - approve-pr
      - merge-pr

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Complete
        run: |

          echo "=========================================="
          echo "CI/CD SUCCESS"
          echo "=========================================="

          echo "FEATURE -> DEV"

          echo "Java 21       : PASS"
          echo "Maven         : PASS"
          echo "Unit Tests    : PASS"
          echo "Docker        : PASS"
          echo "Compose       : PASS"
          echo "PR Creation   : PASS"
          echo "Approval      : PASS"
          echo "Merge         : PASS"

          echo "=========================================="