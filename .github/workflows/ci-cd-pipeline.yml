name: Feature to Dev CI/CD

on:
  push:
    branches:
      - feature

  workflow_dispatch:

# ============================================================
# GLOBAL PERMISSIONS
# ============================================================
permissions:
  contents: write
  pull-requests: write

env:
  JAVA_VERSION: '21'
  SOURCE_BRANCH: feature
  TARGET_BRANCH: dev

jobs:

  # ============================================================
  # 1. BUILD + TEST
  # ============================================================
  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------------------------------
      # Verify Java
      # --------------------------------------------------------
      - name: Verify Java
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version
          mvn -version

      # --------------------------------------------------------
      # Check service
      # --------------------------------------------------------
      - name: Verify Service
        run: |
          echo "=========================================="
          echo "CHECKING SERVICE"
          echo "=========================================="

          if [ ! -d "${{ matrix.service }}" ]; then
            echo "ERROR: Service directory not found"
            echo "${{ matrix.service }}"
            exit 1
          fi

          if [ ! -f "${{ matrix.service }}/pom.xml" ]; then
            echo "ERROR: pom.xml not found"
            echo "${{ matrix.service }}/pom.xml"
            exit 1
          fi

          echo "Service found:"
          echo "${{ matrix.service }}"

      # --------------------------------------------------------
      # Maven build/test with retry
      # --------------------------------------------------------
      - name: Maven Build and Test
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          set +e

          for attempt in 1 2 3
          do
            echo ""
            echo "=========================================="
            echo "MAVEN ATTEMPT $attempt / 3"
            echo "=========================================="

            if [ -f "./mvnw" ]; then

              chmod +x ./mvnw

              ./mvnw clean test package -U

              RESULT=$?

            else

              mvn clean test package -U

              RESULT=$?

            fi

            if [ $RESULT -eq 0 ]; then

              echo ""
              echo "=========================================="
              echo "MAVEN BUILD SUCCESS"
              echo "=========================================="

              exit 0

            fi

            echo ""
            echo "Maven build failed."

            if [ "$attempt" -lt 3 ]; then

              echo "Retrying in 20 seconds..."

              sleep 20

            fi

          done

          echo ""
          echo "=========================================="
          echo "MAVEN BUILD FAILED"
          echo "=========================================="

          exit 1


  # ============================================================
  # 2. DOCKER BUILD
  # ============================================================
  docker-build:
    name: Docker Build - ${{ matrix.service }}

    needs:
      - build-and-test

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      # --------------------------------------------------------
      # Docker version
      # --------------------------------------------------------
      - name: Check Docker
        run: |
          docker --version

      # --------------------------------------------------------
      # Check Dockerfile
      # --------------------------------------------------------
      - name: Check Dockerfile
        run: |
          echo "Checking Dockerfile..."

          if [ ! -f "${{ matrix.service }}/Dockerfile" ]; then

            echo "ERROR: Dockerfile not found"

            echo "${{ matrix.service }}/Dockerfile"

            exit 1

          fi

          echo "Dockerfile found."


      # --------------------------------------------------------
      # Docker build
      # --------------------------------------------------------
      - name: Build Docker Image
        run: |

          echo "=========================================="
          echo "DOCKER BUILD"
          echo "=========================================="

          docker build \
            -t "${{ matrix.service }}:feature-${{ github.sha }}" \
            "./${{ matrix.service }}"


      # --------------------------------------------------------
      # Verify image
      # --------------------------------------------------------
      - name: Verify Docker Image
        run: |

          docker image inspect \
            "${{ matrix.service }}:feature-${{ github.sha }}"

          echo "Docker image verified successfully."


  # ============================================================
  # 3. DOCKER COMPOSE
  # ============================================================
  docker-compose:
    name: Docker Compose Validation

    needs:
      - build-and-test

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Feature
        uses: actions/checkout@v4
        with:
          ref: feature

      # --------------------------------------------------------
      # Docker Compose version
      # --------------------------------------------------------
      - name: Docker Compose Version
        run: |
          docker compose version

      # --------------------------------------------------------
      # Find compose file
      # --------------------------------------------------------
      - name: Detect Compose File
        shell: bash
        run: |

          echo "=========================================="
          echo "SEARCHING DOCKER COMPOSE FILE"
          echo "=========================================="

          if [ -f "docker-compose.yml" ]; then

            echo "Found docker-compose.yml"

            echo "COMPOSE_FILE=docker-compose.yml" >> "$GITHUB_ENV"

          elif [ -f "docker-compose.yaml" ]; then

            echo "Found docker-compose.yaml"

            echo "COMPOSE_FILE=docker-compose.yaml" >> "$GITHUB_ENV"

          else

            echo "ERROR: Docker Compose file not found"

            exit 1

          fi


      # --------------------------------------------------------
      # Validate compose
      # --------------------------------------------------------
      - name: Validate Docker Compose
        run: |

          echo "=========================================="
          echo "DOCKER COMPOSE VALIDATION"
          echo "=========================================="

          docker compose \
            -f "$COMPOSE_FILE" \
            config


      # --------------------------------------------------------
      # Build compose
      # --------------------------------------------------------
      - name: Build Docker Compose
        run: |

          echo "=========================================="
          echo "DOCKER COMPOSE BUILD"
          echo "=========================================="

          docker compose \
            -f "$COMPOSE_FILE" \
            build


  # ============================================================
  # 4. CHECK FEATURE → DEV CHANGES
  # ============================================================
  check-changes:
    name: Check Feature → Dev Changes

    needs:
      - build-and-test
      - docker-build
      - docker-compose

    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Fetch branches
      # --------------------------------------------------------
      - name: Fetch Feature and Dev
        run: |

          git fetch origin feature
          git fetch origin dev

      # --------------------------------------------------------
      # Compare branches
      # --------------------------------------------------------
      - name: Check Changes
        id: check
        shell: bash
        run: |

          echo "=========================================="
          echo "FEATURE → DEV CHANGE CHECK"
          echo "=========================================="

          FEATURE_COMMIT=$(git rev-parse origin/feature)
          DEV_COMMIT=$(git rev-parse origin/dev)

          echo "Feature commit:"
          echo "$FEATURE_COMMIT"

          echo ""

          echo "Dev commit:"
          echo "$DEV_COMMIT"

          echo ""

          COMMITS=$(git rev-list --count origin/dev..origin/feature)

          echo "Commits in feature but not dev:"
          echo "$COMMITS"

          echo ""

          if [ "$COMMITS" -gt 0 ]; then

            echo "Changes found."

            echo "has_changes=true" >> "$GITHUB_OUTPUT"

          else

            echo "No changes between feature and dev."

            echo "has_changes=false" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # 5. CREATE PULL REQUEST
  # ============================================================
  create-pr:
    name: Create Feature → Dev PR

    needs:
      - check-changes

    if: needs.check-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:

      # --------------------------------------------------------
      # Create or find PR
      # --------------------------------------------------------
      - name: Create or Find PR
        id: pr

        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |

          echo "=========================================="
          echo "FEATURE → DEV PULL REQUEST"
          echo "=========================================="

          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo ""

          echo "Source branch:"
          echo "feature"

          echo ""

          echo "Target branch:"
          echo "dev"

          echo ""
          echo "Checking existing PR..."

          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base dev \
            --head feature \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo ""
            echo "=========================================="
            echo "EXISTING PR FOUND"
            echo "=========================================="

            echo "PR: #$EXISTING_PR"

            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "Creating new PR..."

            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base dev \
              --head feature \
              --title "Feature → Dev: Automated CI/CD" \
              --body "## Automated Feature → Dev Pull Request

          This Pull Request was automatically created by GitHub Actions.

          ### Source

          feature

          ### Target

          dev

          ### CI Validation

          - Java 21
          - Maven build
          - Unit tests
          - Docker build
          - Docker Compose validation

          ### Pipeline

          feature
          ↓
          Build
          ↓
          Test
          ↓
          Docker
          ↓
          Docker Compose
          ↓
          Pull Request
          ↓
          Automatic Merge
          ↓
          dev")

            PR_NUMBER=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq '.number')

            echo ""
            echo "=========================================="
            echo "PR CREATED"
            echo "=========================================="

            echo "PR: #$PR_NUMBER"

            echo ""

            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          fi


  # ============================================================
  # 6. AUTOMATIC MERGE
  # ============================================================
  merge-pr:
    name: Automatic Merge → Dev

    needs:
      - create-pr

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      # --------------------------------------------------------
      # Enable auto merge
      # --------------------------------------------------------
      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}

        shell: bash

        run: |

          echo "=========================================="
          echo "AUTOMATIC MERGE"
          echo "=========================================="

          echo "PR:"
          echo "#$PR_NUMBER"

          echo ""

          echo "Enabling GitHub Auto Merge..."

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch=false

          echo ""

          echo "=========================================="
          echo "AUTO MERGE ENABLED"
          echo "=========================================="

          echo ""

          echo "GitHub will merge the PR when all required"
          echo "checks and branch rules are satisfied."


  # ============================================================
  # 7. SUCCESS SUMMARY
  # ============================================================
  success:
    name: Feature → Dev CI/CD Complete

    needs:
      - build-and-test
      - docker-build
      - docker-compose
      - check-changes
      - create-pr
      - merge-pr

    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.docker-compose.result == 'success' &&
      needs.check-changes.result == 'success' &&
      (
        (
          needs.create-pr.result == 'success' &&
          needs.merge-pr.result == 'success'
        ) ||
        (
          needs.check-changes.outputs.has_changes == 'false' &&
          needs.create-pr.result == 'skipped' &&
          needs.merge-pr.result == 'skipped'
        )
      )

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Summary
        run: |

          echo ""
          echo "=========================================="
          echo "      FEATURE → DEV CI/CD SUCCESS"
          echo "=========================================="

          echo ""

          echo "Java 21          : PASS"
          echo "Maven            : PASS"
          echo "Unit Tests       : PASS"
          echo "Docker           : PASS"
          echo "Docker Compose   : PASS"
          echo "Change Detection : PASS"
          if [ "${{ needs.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "PR Creation      : PASS"
            echo "Auto Merge       : ENABLED"
          else
            echo "PR Creation      : NOT NEEDED"
            echo "Auto Merge       : NOT NEEDED"
          fi

          echo ""

          echo "=========================================="
          echo "           PIPELINE COMPLETE"
          echo "=========================================="
