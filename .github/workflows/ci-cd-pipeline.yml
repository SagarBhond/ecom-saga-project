name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature-swagger
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  DOCKERHUB_USERNAME: sagarbhond

jobs:
  build-and-test:
    name: Build and Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate service directory
        shell: bash
        run: |
          if [ ! -d "${{ matrix.service }}" ]; then
            echo "ERROR: Service directory not found: ${{ matrix.service }}"
            exit 1
          fi

      - name: Build and Test Service
        shell: bash
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean test package
          elif [ -f "pom.xml" ]; then
            mvn -B clean test package
          else
            echo "ERROR: pom.xml or mvnw not found in ${{ matrix.service }}"
            exit 1
          fi

  build-and-push-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - inventory-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package JAR for ${{ matrix.service }}
        shell: bash
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-swagger' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-build:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose build
        shell: bash
        run: |
          docker compose config > /dev/null
          docker compose build

  deploy:
    name: Deploy to EC2 over SSH
    runs-on: ubuntu-latest
    needs:
      - build-and-push-docker
      - docker-compose-build
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-swagger')) || github.event_name == 'workflow_dispatch' }}
    environment: production
    steps:
      - name: Configure AWS credentials with static keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="/home/ec2-user/ecom-saga-project"
            REPO_URL="https://github.com/SagarBhond/ecom-saga-project.git"

            git config --global --add safe.directory "$PROJECT_DIR"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone "$REPO_URL" "$PROJECT_DIR"
            else
              sudo chown -R ec2-user:ec2-user "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            chmod +x scripts/*.sh infre_terraform/*.sh
            docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f Infrastructure/docker-compose.prod.yml up -d --force-recreate

            echo "Deployment complete."
