name: Deploy E-commerce Saga

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Deploy application and monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find application instance
        id: app
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-app" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Application instance was not found."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          APP_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          test -n "$APP_IP" && test "$APP_IP" != "None"
          echo "public_ip=$APP_IP" >> "$GITHUB_OUTPUT"

      - name: Find monitoring endpoint
        id: monitoring_endpoint
        shell: bash
        run: |
          MONITORING_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [ -z "$MONITORING_IP" ] || [ "$MONITORING_IP" = "None" ]; then
            echo "Monitoring instance was not found."
            exit 1
          fi

          echo "public_ip=$MONITORING_IP" >> "$GITHUB_OUTPUT"

      - name: Deploy application stack
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.app.outputs.instance_id }}
          APP_IP: ${{ steps.app.outputs.public_ip }}
          MONITORING_IP: ${{ steps.monitoring_endpoint.outputs.public_ip }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy application $GITHUB_SHA" \
            --parameters commands='[
              "set -e",
              "if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/SagarBhond/ecom-saga-project.git /home/ec2-user/app; fi",
              "cd /home/ec2-user/app",
              "git fetch origin",
              "git checkout main",
              "git reset --hard origin/main",
              "if [ ! -f .env ]; then cp .env.example .env; fi",
              "chmod +x scripts/*.sh",
              "MONITORING_IP=$MONITORING_IP ./scripts/configure-monitoring-ips.sh app",
              "if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE='docker-compose'; else echo 'Docker Compose is not installed'; exit 1; fi",
              "$COMPOSE -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml pull",
              "$COMPOSE -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml down --remove-orphans",
              "$COMPOSE -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml up -d --pull always --force-recreate",
              "for i in {1..30}; do curl -sf http://localhost:8081/actuator/prometheus >/dev/null && curl -sf http://localhost:8082/actuator/prometheus >/dev/null && curl -sf http://localhost:8080/metrics >/dev/null && curl -sf http://localhost:9100/metrics >/dev/null && exit 0; sleep 5; done",
              "exit 1"
            ]' \
            --query Command.CommandId \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)
            echo "Application deployment: $STATUS ($attempt/60)"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done

      - name: Find monitoring instance
        id: monitoring
        shell: bash
        run: |
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$MONITORING_INSTANCE_ID" ] || [ "$MONITORING_INSTANCE_ID" = "None" ]; then
            echo "Monitoring instance was not found."
            exit 1
          fi

          echo "instance_id=$MONITORING_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          MONITORING_IP=$(aws ec2 describe-instances \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          test -n "$MONITORING_IP" && test "$MONITORING_IP" != "None"
          echo "public_ip=$MONITORING_IP" >> "$GITHUB_OUTPUT"

      - name: Deploy monitoring stack
        shell: bash
        env:
          MONITORING_INSTANCE_ID: ${{ steps.monitoring.outputs.instance_id }}
          MONITORING_IP: ${{ steps.monitoring.outputs.public_ip }}
          APP_IP: ${{ steps.app.outputs.public_ip }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy monitoring $GITHUB_SHA" \
            --parameters commands='[
              "set -e",
              "if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/SagarBhond/ecom-saga-project.git /home/ec2-user/app; fi",
              "cd /home/ec2-user/app",
              "git fetch origin",
              "git checkout main",
              "git reset --hard origin/main",
              "chmod +x scripts/*.sh",
              "APP_IP=$APP_IP ./scripts/configure-monitoring-ips.sh monitoring",
              "if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE='docker-compose'; else echo 'Docker Compose is not installed'; exit 1; fi",
              "$COMPOSE -f docker-compose.monitoring.yml down --remove-orphans",
              "$COMPOSE -f docker-compose.monitoring.yml up -d --pull always --force-recreate",
              "for i in {1..30}; do curl -sf http://localhost:3100/ready >/dev/null && curl -sf http://localhost:9090/-/ready >/dev/null && curl -sf http://localhost:8080/metrics >/dev/null && curl -sf http://localhost:9100/metrics >/dev/null && curl -sf http://localhost:3100/loki/api/v1/labels >/dev/null && exit 0; sleep 5; done",
              "exit 1"
            ]' \
            --query Command.CommandId \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MONITORING_INSTANCE_ID" \
              --query Status \
              --output text)
            echo "Monitoring deployment: $STATUS ($attempt/60)"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$MONITORING_INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done