name: Deploy E-commerce Saga

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Feature to Dev CI/CD
    branches:
      - feature
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  deploy:
    name: Deploy application and monitoring
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION secret is missing"; exit 1; }
          test -n "$INSTANCE_ID" || { echo "EC2_INSTANCE_ID secret is missing"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy application stack
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy application $GITHUB_SHA" \
            --parameters commands='[
              "set -e",
              "if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/SagarBhond/ecom-saga-project.git /home/ec2-user/app; fi",
              "cd /home/ec2-user/app",
              "git fetch origin",
              "git checkout main",
              "git reset --hard origin/main",
              "if [ ! -f .env ]; then cp .env.example .env; fi",
              "chmod +x scripts/*.sh",
              "./scripts/configure-monitoring-ips.sh app",
              "docker compose -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml pull",
              "docker compose -f docker-compose.yml -f infre_terraform/docker-compose.prod.yml up -d --force-recreate",
              "for i in {1..30}; do curl -sf http://localhost:8081/actuator/prometheus >/dev/null && curl -sf http://localhost:8082/actuator/prometheus >/dev/null && curl -sf http://localhost:8080/metrics >/dev/null && curl -sf http://localhost:9100/metrics >/dev/null && exit 0; sleep 5; done",
              "exit 1"
            ]' \
            --query Command.CommandId \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)
            echo "Application deployment: $STATUS ($attempt/60)"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|TimedOut|Cancelled) exit 1 ;; esac
            sleep 5
          done

      - name: Find monitoring instance
        id: monitoring
        shell: bash
        run: |
          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ecom-saga-monitoring" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$MONITORING_INSTANCE_ID" ] || [ "$MONITORING_INSTANCE_ID" = "None" ]; then
            echo "Monitoring instance was not found."
            exit 1
          fi

          echo "instance_id=$MONITORING_INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy monitoring stack
        shell: bash
        env:
          MONITORING_INSTANCE_ID: ${{ steps.monitoring.outputs.instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy monitoring $GITHUB_SHA" \
            --parameters commands='[
              "set -e",
              "if [ ! -d /home/ec2-user/app/.git ]; then git clone https://github.com/SagarBhond/ecom-saga-project.git /home/ec2-user/app; fi",
              "cd /home/ec2-user/app",
              "git fetch origin",
              "git checkout main",
              "git reset --hard origin/main",
              "chmod +x scripts/*.sh",
              "./scripts/configure-monitoring-ips.sh monitoring",
              "docker compose -f docker-compose.monitoring.yml up -d --force-recreate",
              "for i in {1..30}; do curl -sf http://localhost:3100/ready >/dev/null && curl -sf http://localhost:9080/ready >/dev/null && curl -sf http://localhost:9090/-/ready >/dev/null && curl -sf http://localhost:8080/metrics >/dev/null && curl -sf http://localhost:9100/metrics >/dev/null && exit 0; sleep 5; done",
              "exit 1"
            ]' \
            --query Command.CommandId \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MONITORING_INSTANCE_ID" \
              --query Status \
              --output text)
            echo "Monitoring deployment: $STATUS ($attempt/60)"
            [ "$STATUS" = "Success" ] && break
            case "$STATUS" in Failed|TimedOut|Cancelled) exit 1 ;; esac
            sleep 5
          done